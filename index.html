<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Маршрутизація автобусів (ORS + ArcGIS)</title>
  
  <link rel="stylesheet" href="https://js.arcgis.com/4.28/esri/themes/light/main.css">
  <script src="https://js.arcgis.com/4.28/"></script>

  <style>
    html, body, #viewDiv {
      padding: 0;
      margin: 0;
      height: 100%;
      width: 100%;
      font-family: sans-serif;
    }
    #ui-panel {
      position: absolute;
      top: 15px;
      right: 15px;
      background: white;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      z-index: 99;
      width: 290px;
      max-height: 90vh;
      overflow-y: auto;
    }
    button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      background-color: #0079c1;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      box-sizing: border-box;
    }
    button:hover { background-color: #005a92; }
    #clearBtn { background-color: #d32f2f; }
    #clearBtn:hover { background-color: #b71c1c; }
    #saveBtn { background-color: #2e7d32; margin-top: 15px; }
    #saveBtn:hover { background-color: #1b5e20; }
    
    #searchBtn { background-color: #e0e0e0; color: #333; margin-top: 5px; }
    #searchBtn:hover { background-color: #ccc; }
    
    #status { margin-top: 10px; font-size: 13px; color: #555; }
    
    #saveForm {
      display: none;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #ddd;
    }
    .form-group {
      margin-bottom: 10px;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      margin-bottom: 4px;
      color: #333;
      font-weight: bold;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 6px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <div id="viewDiv"></div>
  
  <div id="ui-panel">
    <h3 style="margin-top: 0; font-size: 16px;">Побудова маршруту</h3>
    
    <div style="margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid #eee;">
      <label style="font-size: 12px; font-weight: bold;">Пошук маршруту</label>
      
      <select id="searchDirection" style="width: 100%; padding: 6px; margin-top: 5px; margin-bottom: 5px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;">
        <option value="Прямий">Напрямок: Прямий</option>
        <option value="Зворотній">Напрямок: Зворотній</option>
      </select>

      <input type="text" id="searchRouteNum" placeholder="Номер (Напр: 107-505)" style="width: 100%; padding: 6px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;">
      <button id="searchBtn">Знайти зупинки</button>
    </div>

    <p style="font-size: 12px; margin-bottom: 5px;">Або клікайте на зупинки на карті вручну.</p>
    <div id="status">Обрано зупинок: 0</div>
    <button id="buildRouteBtn">Побудувати маршрут</button>
    <button id="clearBtn">Очистити</button>

    <div id="saveForm">
      <div class="form-group">
        <label>Номер маршруту</label>
        <input type="text" id="inputRouteNum" placeholder="Наприклад: 107-505">
      </div>
      <div class="form-group">
        <label>Назва маршруту</label>
        <input type="text" id="inputRouteName" placeholder="Наприклад: Берегово – Кушниця">
      </div>
      <div class="form-group">
        <label>Статус маршруту</label>
        <select id="inputRouteState">
          <option value="Діючий">Діючий</option>
          <option value="Не діючий">Не діючий</option>
        </select>
      </div>
      <div class="form-group">
        <label>Тип маршруту</label>
        <select id="inputRouteType">
          <option value="Приміський">Приміський</option>
          <option value="Міжміський">Міжміський</option>
        </select>
      </div>
      <div class="form-group">
        <label>Режим руху</label>
        <select id="inputTrafficMode">
          <option value="Звичайний">Звичайний</option>
          <option value="Експрес">Експрес</option>
          <option value="Маршрутне таксі">Маршрутне таксі</option>
        </select>
      </div>
      <div class="form-group">
        <label>Перевізник</label>
        <input type="text" id="inputTransporter" placeholder="Введіть назву перевізника">
      </div>
      
      <button id="saveBtn">Зберегти маршрут</button>
    </div>
  </div>

  <script>
    require([
      "esri/config",
      "esri/identity/IdentityManager", 
      "esri/WebMap",
      "esri/views/MapView",
      "esri/layers/GraphicsLayer",
      "esri/layers/FeatureLayer",
      "esri/Graphic",
      "esri/widgets/BasemapGallery", 
      "esri/widgets/Expand"          
    ], function(esriConfig, esriId, WebMap, MapView, GraphicsLayer, FeatureLayer, Graphic, BasemapGallery, Expand) {

      esriConfig.portalUrl = "https://gis.carpathia.gov.ua/portal";

      const webmap = new WebMap({
        portalItem: {
          id: "61d4d16001a04bfca24bade650649522" 
        }
      });

      webmap.load().catch(function(error) {
        console.error("ПОМИЛКА ЗАВАНТАЖЕННЯ КАРТИ:", error);
        alert("Помилка завантаження карти. Перевірте консоль (F12) для деталей.");
      });

      const view = new MapView({
        container: "viewDiv",
        map: webmap
      });

      const basemapGallery = new BasemapGallery({ view: view });
      const bgExpand = new Expand({
        view: view,
        content: basemapGallery,
        expandTooltip: "Змінити базову карту"
      });
      view.ui.add(bgExpand, "top-left");

      const saveTargetLayer = new FeatureLayer({
        portalItem: { id: "efaae7d10f624d848f3dda0933001e14" }
      });

      view.popup.autoOpenEnabled = false;

      const routeLayer = new GraphicsLayer();
      const stopsLayer = new GraphicsLayer();
      webmap.addMany([routeLayer, stopsLayer]);

      let selectedStopsCoordinates = []; 
      let currentRouteGeometry = null; 

      // --- ДОДАНО: Анімація блимання обраних зупинок ---
      let blinkState = false;
      setInterval(() => {
        if (stopsLayer.graphics.length > 0) {
          blinkState = !blinkState;
          
          // Стан 1: Стандартний помаранчевий маркер з контрастним чорним контуром
          const symbolA = {
            type: "simple-marker",
            color: [226, 119, 40, 1],
            outline: { color: [0, 0, 0, 1], width: 2 },
            size: "14px"
          };
          
          // Стан 2: Збільшений яскраво-жовтий маркер із червоним контуром
          const symbolB = {
            type: "simple-marker",
            color: [255, 255, 0, 1],
            outline: { color: [200, 0, 0, 1], width: 3 },
            size: "20px"
          };

          const currentSymbol = blinkState ? symbolA : symbolB;

          // Оновлюємо символи для всіх знайдених точок
          stopsLayer.graphics.forEach(graphic => {
            graphic.symbol = currentSymbol;
          });
        }
      }, 600); // Швидкість блимання (600 мс)
      // ------------------------------------------------

      const normalizeString = (str) => {
        if (str === null || str === undefined) return "";
        return String(str)
          .trim()
          .toLowerCase()
          .replace(/\s+/g, '') 
          .replace(/[–—_−-]/g, '-')
          .replace(/\\/g, '/');
      };

      // Пошук зупинок
      document.getElementById("searchBtn").addEventListener("click", async () => {
        const searchVal = document.getElementById("searchRouteNum").value.trim();
        const searchDir = document.getElementById("searchDirection").value; 
        
        if (!searchVal) {
          alert("Будь ласка, введіть номер маршруту для пошуку.");
          return;
        }

        const normalizedSearch = normalizeString(searchVal);
        resetUI();
        
        document.getElementById("searchBtn").innerText = "Пошук...";
        document.getElementById("searchRouteNum").value = searchVal;

        try {
          const targetLayer = webmap.layers.find(layer => layer.title && layer.title.trim() === searchDir);

          if (!targetLayer) {
            alert(`Шар з назвою "${searchDir}" не знайдено на веб-карті.`);
            return;
          }

          await targetLayer.load();

          const query = targetLayer.createQuery();
          query.where = "1=1"; 
          query.outFields = ["*"];
          query.returnGeometry = true;
          
          let allFeatures = [];
          
          try {
            if (targetLayer.type === "feature" && targetLayer.capabilities && targetLayer.capabilities.query.supportsPagination) {
              let start = 0;
              let num = 2000;
              let hasMore = true;
              while (hasMore) {
                query.start = start;
                query.num = num;
                const res = await targetLayer.queryFeatures(query);
                allFeatures = allFeatures.concat(res.features);
                if (res.exceededTransferLimit || res.features.length === num) {
                  start += num;
                } else {
                  hasMore = false;
                }
                if (start > 50000) break;
              }
            } else {
              query.num = 100000;
              const res = await targetLayer.queryFeatures(query);
              allFeatures = res.features;
            }
          } catch (e) {
            query.start = undefined;
            query.num = 100000;
            const res = await targetLayer.queryFeatures(query);
            allFeatures = res.features;
          }
          
          const matchedFeatures = allFeatures.filter(f => {
            const attrs = f.attributes || {};
            for (const key in attrs) {
              if (attrs.hasOwnProperty(key) && attrs[key]) {
                const valStr = normalizeString(attrs[key]);
                if (valStr === normalizedSearch || valStr.includes(normalizedSearch)) {
                  return true;
                }
              }
            }
            return false;
          });

          if (matchedFeatures.length === 0) {
            alert(`Зупинок для маршруту "${searchVal}" у шарі "${searchDir}" не знайдено.`);
          } else {
            matchedFeatures.forEach(feature => {
              const geom = feature.geometry;
              if (geom && geom.type === "point") {
                selectedStopsCoordinates.push([geom.longitude, geom.latitude]);

                // Символ буде автоматично переписаний інтервалом блимання
                const pointGraphic = new Graphic({
                  geometry: geom,
                  symbol: { type: "simple-marker", color: [226, 119, 40], size: "14px" }
                });
                stopsLayer.add(pointGraphic);
              }
            });

            const firstAttrs = matchedFeatures[0].attributes;
            const guessNum = firstAttrs["routeNum"] || firstAttrs["routenum"] || firstAttrs["Номер маршруту"] || searchVal;
            const guessName = firstAttrs["routeName"] || firstAttrs["routename"] || firstAttrs["Назва маршруту"] || "";
            
            document.getElementById("inputRouteNum").value = guessNum;
            document.getElementById("inputRouteName").value = guessName;

            document.getElementById("status").innerText = `Обрано зупинок: ${selectedStopsCoordinates.length} (Напрямок: ${searchDir})`;
            
            view.goTo({
              target: matchedFeatures
            }, {
              duration: 1000
            });
          }
        } catch (error) {
          console.error("Помилка пошуку:", error);
          alert("Виникла помилка під час пошуку. Відкрийте консоль браузера (F12) для деталей.");
        } finally {
          document.getElementById("searchBtn").innerText = "Знайти зупинки";
        }
      });

      // Ручне додавання точок
      view.on("click", async (event) => {
        const response = await view.hitTest(event);
        
        const validHits = response.results.filter(result => {
          if (result.type !== "graphic" || !result.graphic.layer) return false;
          const layerType = result.graphic.layer.type;
          return layerType === "csv" || layerType === "feature";
        });

        if (validHits.length > 0) {
          const clickedGraphic = validHits[0].graphic;
          const geometry = clickedGraphic.geometry;

          if (geometry && geometry.type === "point") {
            if (selectedStopsCoordinates.length === 0) {
              const attrs = clickedGraphic.attributes || {};
              const rNum = attrs["routeNum"] || attrs["routenum"] || attrs["Номер маршруту"] || "";
              const rName = attrs["routeName"] || attrs["routename"] || attrs["Назва маршруту"] || "";
              
              document.getElementById("inputRouteNum").value = rNum;
              document.getElementById("inputRouteName").value = rName;
            }

            selectedStopsCoordinates.push([geometry.longitude, geometry.latitude]);

            const pointGraphic = new Graphic({
              geometry: geometry,
              symbol: { type: "simple-marker", color: [226, 119, 40], size: "14px" }
            });
            stopsLayer.add(pointGraphic);

            document.getElementById("status").innerText = `Обрано зупинок: ${selectedStopsCoordinates.length}`;
          }
        }
      });

      // Побудова маршруту
      document.getElementById("buildRouteBtn").addEventListener("click", async () => {
        if (selectedStopsCoordinates.length < 2) {
          alert("Будь ласка, виберіть щонайменше дві зупинки.");
          return;
        }

        const apiKey = "eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6IjNlMWYwNWRmZDFhYzQwZDU5NjI4YWE3ODI2NDQ3MDdlIiwiaCI6Im11cm11cjY0In0=";
        const url = "https://api.openrouteservice.org/v2/directions/driving-hgv/geojson"; 

        try {
          document.getElementById("status").innerText = "Обчислення маршруту...";
          
          const response = await fetch(url, {
            method: "POST",
            headers: {
              "Authorization": apiKey,
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              coordinates: selectedStopsCoordinates,
              elevation: false,
              instructions: false
            })
          });

          if (!response.ok) {
            throw new Error(`Помилка API: ${response.status}`);
          }

          const geojson = await response.json();
          drawRoute(geojson);
          document.getElementById("status").innerText = "Маршрут побудовано успішно.";
          
          document.getElementById("saveForm").style.display = "block";
          
        } catch (error) {
          console.error("Помилка маршрутизації:", error);
          document.getElementById("status").innerText = "Помилка побудови маршруту.";
          alert("Не вдалося побудувати маршрут. Перевірте консоль для деталей.");
        }
      });

      function drawRoute(geojson) {
        routeLayer.removeAll(); 
        const coordinates = geojson.features[0].geometry.coordinates;
        currentRouteGeometry = {
          type: "polyline",
          paths: coordinates
        };

        const routeGraphic = new Graphic({
          geometry: currentRouteGeometry,
          symbol: {
            type: "simple-line",
            color: [0, 122, 204, 0.9],
            width: 4
          }
        });
        routeLayer.add(routeGraphic);
      }

      // Збереження маршруту
      document.getElementById("saveBtn").addEventListener("click", () => {
        if (!currentRouteGeometry) {
          alert("Немає маршруту для збереження.");
          return;
        }

        const rNum = document.getElementById("inputRouteNum").value.trim();
        const rName = document.getElementById("inputRouteName").value.trim();
        const rState = document.getElementById("inputRouteState").value;
        const rType = document.getElementById("inputRouteType").value;
        const rTraffic = document.getElementById("inputTrafficMode").value;
        const rTransporter = document.getElementById("inputTransporter").value.trim();

        if (!rNum || !rName) {
          alert("Будь ласка, переконайтеся, що номер та назва маршруту заповнені.");
          return;
        }

        const featureToSave = new Graphic({
          geometry: currentRouteGeometry,
          attributes: {
            "routenum": rNum,
            "routename": rName,
            "routestate": rState,
            "routetype": rType,
            "trafficmode": rTraffic,
            "transporter": rTransporter
          }
        });

        document.getElementById("saveBtn").innerText = "Збереження...";
        document.getElementById("saveBtn").disabled = true;

        saveTargetLayer.applyEdits({
          addFeatures: [featureToSave]
        }).then((editResults) => {
          document.getElementById("saveBtn").innerText = "Зберегти маршрут";
          document.getElementById("saveBtn").disabled = false;

          if (editResults.addFeatureResults.length > 0 && editResults.addFeatureResults[0].error) {
            console.error("Помилка збереження:", editResults.addFeatureResults[0].error);
            alert("Помилка при збереженні маршруту. Перевірте консоль.");
          } else {
            alert(`Маршрут успішно збережено у базу даних!`);
            
            webmap.allLayers.forEach(layer => {
              if (layer.type === "feature") {
                layer.refresh();
              }
            });
            
            resetUI();
          }
        }).catch((error) => {
          document.getElementById("saveBtn").innerText = "Зберегти маршрут";
          document.getElementById("saveBtn").disabled = false;
          console.error("Критична помилка збереження:", error);
          alert("Не вдалося підключитися до шару для збереження. Перевірте права доступу.");
        });
      });

      function resetUI() {
        selectedStopsCoordinates = [];
        currentRouteGeometry = null;
        routeLayer.removeAll();
        stopsLayer.removeAll();
        document.getElementById("status").innerText = "Обрано зупинок: 0";
        
        document.getElementById("inputRouteNum").value = "";
        document.getElementById("inputRouteName").value = "";
        document.getElementById("inputTransporter").value = "";
        
        document.getElementById("saveForm").style.display = "none";
      }

      document.getElementById("clearBtn").addEventListener("click", resetUI);

    });
  </script>
</body>
</html>
